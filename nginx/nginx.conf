# Centralized nginx: static file server for the React SPA + reverse proxy
# to the Django backend, so the browser only ever calls same-origin paths
# (no CORS needed for this deployment path, and the frontend's build never
# needs to know Django's host/port — see frontend/react/.env.production).
#
# Load-balancing seam: today `proxy_pass` points at a single backend
# service by Compose DNS name. To load-balance across multiple Django
# replicas later, add an `upstream django_backend { server ...; server
# ...; }` block above and change both `proxy_pass` lines below to
# `http://django_backend/...` — no other change needed.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashes its built asset filenames (e.g.
    # assets/index-abc123.js), so it's always safe to cache them
    # indefinitely — a code change produces a new filename, not a
    # cache-invalidation problem.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must always be revalidated, since it's what
    # references the (possibly newly-hashed) asset filenames above.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any path not matched above (e.g. a hard refresh on
    # /portfolio, a client-side React Router route) serves index.html so
    # the client-side router can take over, instead of nginx 404ing a
    # path that only exists in the browser's history, not on disk.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # REST API -> Django (django-ledger-app is this app's Compose service
    # name, resolved via Docker's internal DNS).
    location /api/ {
        proxy_pass http://django-ledger-app:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portfolio WebSocket -> Django Channels. Upgrade/Connection headers
    # are required for nginx to actually proxy the WebSocket handshake
    # rather than treating this as a plain HTTP request; the long
    # proxy_read_timeout keeps an idle-but-open socket from being cut off
    # by nginx before the client or server closes it.
    location /ws/ {
        proxy_pass http://django-ledger-app:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
